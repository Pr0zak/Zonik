<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07060f"/>
      <stop offset="100%" stop-color="#0d0b18"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B2F9E"/>
      <stop offset="1" stop-color="#15103A"/>
    </linearGradient>
  </defs>
  <rect width="320" height="100" rx="16" fill="url(#bg)"/>

  <!-- The "Broadcast" mark: the same geometry as frontend/static/favicon.svg and the Android
       launcher icon, authored in a 240-unit space and scaled into an 80x80 tile here. -->
  <g transform="translate(10 10) scale(0.3333)">
    <rect width="240" height="240" rx="44" fill="url(#mark)"/>
    <g transform="translate(120 120) scale(1.35) translate(-120 -120)"
       fill="none" stroke="#AFA9EC" stroke-linecap="round">
      <path d="M98,98 L142,98 L98,142 L142,142" stroke-width="13" stroke-linejoin="round"/>
      <path d="M158.30,87.86 A50,50 0 0,1 158.30,152.14 M81.70,152.14 A50,50 0 0,1 81.70,87.86" stroke-width="8"/>
      <path d="M174.72,83.09 A66,66 0 0,1 174.72,156.91 M65.28,156.91 A66,66 0 0,1 65.28,83.09" stroke-width="8" stroke-opacity="0.6"/>
    </g>
  </g>

  <!-- ZONIK text -->
  <text x="205" y="60" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" text-anchor="middle" letter-spacing="7">
    <tspan fill="#AFA9EC">Z</tspan><tspan fill="#e5e5e5">ONIK</tspan>
  </text>
  <!-- Subtitle -->
  <text x="205" y="79" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#8a8a8a" letter-spacing="2">
    SELF-HOSTED MUSIC SERVER
  </text>
  <!-- Accent line -->
  <line x1="140" y1="87" x2="270" y2="87" stroke="#534AB7" stroke-width="1.5" opacity="0.35"/>
</svg>
