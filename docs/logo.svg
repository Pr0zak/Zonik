<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07060f"/>
      <stop offset="100%" stop-color="#0d0b18"/>
    </linearGradient>
  </defs>
  <rect width="320" height="100" rx="16" fill="url(#bg)"/>
  <!-- Vinyl rings -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#1c1836" stroke-width="2"/>
  <circle cx="50" cy="50" r="28" fill="none" stroke="#1c1836" stroke-width="2"/>
  <circle cx="50" cy="50" r="18" fill="none" stroke="#1c1836" stroke-width="2"/>
  <circle cx="50" cy="50" r="10" fill="#08060e" stroke="#534AB7" stroke-width="1"/>
  <!-- Mini Z -->
  <path d="M 40,38 L 60,38 L 40,62 L 60,62"
        fill="none" stroke="#AFA9EC" stroke-width="5"
        stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- ZONIK text -->
  <text x="185" y="62" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" text-anchor="middle" letter-spacing="7">
    <tspan fill="#AFA9EC">Z</tspan><tspan fill="#e5e5e5">ONIK</tspan>
  </text>
  <!-- Subtitle -->
  <text x="185" y="80" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#737373" letter-spacing="3">
    SELF-HOSTED MUSIC SERVER
  </text>
  <!-- Accent line -->
  <line x1="120" y1="88" x2="250" y2="88" stroke="#534AB7" stroke-width="1.5" opacity="0.3"/>
</svg>
